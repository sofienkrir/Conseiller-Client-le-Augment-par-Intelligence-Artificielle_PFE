<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="800" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="74" fill="url(#header)"/>
  <text x="40" y="46" fill="#FFFFFF" font-size="27" font-weight="700">Architecture de Sécurité — Défense en Profondeur</text>
  <text x="1400" y="46" fill="#FBBF24" font-size="16" font-weight="600" text-anchor="end">Conforme PSD2 · SCA + TRA</text>

  <!-- ============ ROW 1 : AUTH FLOW ============ -->
  <text x="40" y="108" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">CONNEXION SÉCURISÉE</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="40" y="118" width="120" height="116" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <circle cx="100" cy="158" r="17" fill="#E8620C"/>
  <path d="M75 200 a25 22 0 0 1 50 0 Z" fill="#E8620C"/>
  <text x="100" y="222" fill="#1F2937" font-size="14" font-weight="600" text-anchor="middle">Client / Admin</text>

  <!-- helper: gate cards -->
  <!-- Gate 1 -->
  <g filter="url(#shadow)">
    <rect x="210" y="118" width="195" height="116" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="210" y="118" width="195" height="6" rx="3" fill="#E8620C"/>
  <circle cx="234" cy="150" r="13" fill="#FFF1E6"/>
  <text x="234" y="155" fill="#E8620C" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="258" y="155" fill="#1F2937" font-size="17" font-weight="700">Mot de passe</text>
  <text x="232" y="192" fill="#64748B" font-size="14">bcrypt — haché &amp; salé</text>

  <!-- Gate 2 -->
  <g filter="url(#shadow)">
    <rect x="435" y="118" width="195" height="116" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="435" y="118" width="195" height="6" rx="3" fill="#E8620C"/>
  <circle cx="459" cy="150" r="13" fill="#FFF1E6"/>
  <text x="459" y="155" fill="#E8620C" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="483" y="155" fill="#1F2937" font-size="17" font-weight="700">2FA e-mail</text>
  <text x="457" y="187" fill="#64748B" font-size="14">code 6 chiffres · SHA-256</text>
  <text x="457" y="208" fill="#64748B" font-size="14">expire 10 min · usage unique</text>

  <!-- Gate 3 -->
  <g filter="url(#shadow)">
    <rect x="660" y="118" width="195" height="116" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="660" y="118" width="195" height="6" rx="3" fill="#E8620C"/>
  <circle cx="684" cy="150" r="13" fill="#FFF1E6"/>
  <text x="684" y="155" fill="#E8620C" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="708" y="155" fill="#1F2937" font-size="17" font-weight="700">Analyse risque</text>
  <text x="682" y="187" fill="#64748B" font-size="14">RBA · score 0–100</text>
  <text x="682" y="208" fill="#64748B" font-size="14">8 facteurs · post-2FA</text>

  <!-- Gate 4 -->
  <g filter="url(#shadow)">
    <rect x="885" y="118" width="195" height="116" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="885" y="118" width="195" height="6" rx="3" fill="#16A34A"/>
  <circle cx="909" cy="150" r="13" fill="#DCFCE7"/>
  <text x="909" y="155" fill="#16A34A" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text x="933" y="155" fill="#1F2937" font-size="17" font-weight="700">Accès JWT</text>
  <text x="907" y="187" fill="#64748B" font-size="14">jeton signé · stateless</text>
  <text x="907" y="208" fill="#64748B" font-size="14">+ révocation en base</text>

  <!-- Platform -->
  <g filter="url(#shadow)">
    <rect x="1135" y="118" width="170" height="116" rx="14" fill="#0F172A"/>
  </g>
  <text x="1220" y="170" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Plateforme</text>
  <text x="1220" y="196" fill="#CBD5E1" font-size="14" text-anchor="middle">Chatbot · RDV</text>
  <text x="1220" y="215" fill="#CBD5E1" font-size="14" text-anchor="middle">Admin · PDF</text>

  <!-- Arrows row1 -->
  <line x1="160" y1="176" x2="205" y2="176" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="405" y1="176" x2="430" y2="176" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="176" x2="655" y2="176" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="855" y1="176" x2="880" y2="176" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1080" y1="176" x2="1130" y2="176" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 2 : RBA LEVELS ============ -->
  <!-- connector from RBA down to bus -->
  <line x1="757" y1="234" x2="757" y2="300" stroke="#CBD5E1" stroke-width="2.5"/>
  <line x1="505" y1="300" x2="1030" y2="300" stroke="#CBD5E1" stroke-width="2.5"/>
  <line x1="505" y1="300" x2="505" y2="332" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="300" x2="680" y2="332" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="855" y1="300" x2="855" y2="332" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="300" x2="1030" y2="332" stroke="#CBD5E1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="430" y="290" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">NIVEAUX DE RISQUE → ACTION</text>

  <!-- LOW -->
  <g filter="url(#shadow)">
    <rect x="430" y="334" width="150" height="72" rx="12" fill="#F0FDF4" stroke="#86EFAC"/>
  </g>
  <text x="505" y="362" fill="#15803D" font-size="16" font-weight="700" text-anchor="middle">LOW</text>
  <text x="505" y="386" fill="#166534" font-size="13.5" text-anchor="middle">Accès autorisé</text>

  <!-- MEDIUM -->
  <g filter="url(#shadow)">
    <rect x="605" y="334" width="150" height="72" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
  </g>
  <text x="680" y="362" fill="#1D4ED8" font-size="16" font-weight="700" text-anchor="middle">MEDIUM</text>
  <text x="680" y="386" fill="#1E40AF" font-size="13.5" text-anchor="middle">E-mail d'info</text>

  <!-- HIGH -->
  <g filter="url(#shadow)">
    <rect x="780" y="334" width="150" height="72" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  </g>
  <text x="855" y="362" fill="#C2410C" font-size="16" font-weight="700" text-anchor="middle">HIGH</text>
  <text x="855" y="386" fill="#9A3412" font-size="13.5" text-anchor="middle">Alerte + « Pas moi »</text>

  <!-- CRITICAL -->
  <g filter="url(#shadow)">
    <rect x="955" y="334" width="150" height="72" rx="12" fill="#FEF2F2" stroke="#FCA5A5"/>
  </g>
  <text x="1030" y="362" fill="#B91C1C" font-size="16" font-weight="700" text-anchor="middle">CRITICAL</text>
  <text x="1030" y="386" fill="#991B1B" font-size="13.5" text-anchor="middle">Blocage + sessions</text>

  <!-- ============ ROW 3 : INCIDENT LOOP ============ -->
  <!-- bracket from HIGH/CRITICAL to loop -->
  <line x1="855" y1="406" x2="855" y2="436" stroke="#EA580C" stroke-width="2.5"/>
  <line x1="1030" y1="406" x2="1030" y2="436" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="855" y1="436" x2="1030" y2="436" stroke="#EA580C" stroke-width="2.5"/>
  <line x1="942" y1="436" x2="942" y2="470" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arrowDark)"/>

  <text x="430" y="462" fill="#64748B" font-size="15" font-weight="700" letter-spacing="1">RÉPONSE À INCIDENT (boucle fermée)</text>

  <!-- step A -->
  <g filter="url(#shadow)">
    <rect x="430" y="478" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="540" y="510" fill="#1F2937" font-size="16" font-weight="700" text-anchor="middle">E-mail d'alerte</text>
  <text x="540" y="534" fill="#64748B" font-size="13.5" text-anchor="middle">lien sécurisé envoyé</text>

  <!-- step B -->
  <g filter="url(#shadow)">
    <rect x="700" y="478" width="240" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="820" y="505" fill="#1F2937" font-size="16" font-weight="700" text-anchor="middle">« Ce n'était pas moi »</text>
  <text x="820" y="528" fill="#64748B" font-size="13.5" text-anchor="middle">token HMAC · 48h · usage unique</text>

  <!-- step C -->
  <g filter="url(#shadow)">
    <rect x="990" y="478" width="240" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="1110" y="505" fill="#1F2937" font-size="16" font-weight="700" text-anchor="middle">Compte sécurisé</text>
  <text x="1110" y="528" fill="#64748B" font-size="13.5" text-anchor="middle">sessions révoquées · reset MDP</text>

  <line x1="650" y1="517" x2="695" y2="517" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="517" x2="985" y2="517" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 4 : TRANSVERSAL LAYER ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="600" width="1360" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="40" y="600" width="10" height="150" rx="5" fill="#0F172A"/>
  <text x="70" y="638" fill="#0F172A" font-size="18" font-weight="700">Sécurité transversale — toutes les couches</text>

  <!-- pill 1 -->
  <rect x="70" y="660" width="420" height="68" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <circle cx="104" cy="694" r="16" fill="#0F172A"/>
  <text x="104" y="700" fill="#FFFFFF" font-size="15" text-anchor="middle">🔒</text>
  <text x="132" y="690" fill="#1F2937" font-size="15.5" font-weight="700">Chiffrement Fernet</text>
  <text x="132" y="712" fill="#64748B" font-size="13.5">AES-128 + HMAC · données clients sensibles</text>

  <!-- pill 2 -->
  <rect x="510" y="660" width="420" height="68" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <circle cx="544" cy="694" r="16" fill="#E8620C"/>
  <text x="544" y="700" fill="#FFFFFF" font-size="15" text-anchor="middle">👤</text>
  <text x="572" y="690" fill="#1F2937" font-size="15.5" font-weight="700">Contrôle d'accès — RBAC</text>
  <text x="572" y="712" fill="#64748B" font-size="13.5">rôles user / admin · endpoints protégés</text>

  <!-- pill 3 -->
  <rect x="950" y="660" width="420" height="68" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <circle cx="984" cy="694" r="16" fill="#2563EB"/>
  <text x="984" y="700" fill="#FFFFFF" font-size="15" text-anchor="middle">📋</text>
  <text x="1012" y="690" fill="#1F2937" font-size="15.5" font-weight="700">Traçabilité &amp; Audit</text>
  <text x="1012" y="712" fill="#64748B" font-size="13.5">sessions · appareils · incidents de sécurité</text>
</svg>
